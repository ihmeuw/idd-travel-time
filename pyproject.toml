[project]
name = "idd-travel-time"
version = "0.1.0"
description = "Travel-time isochrones from arbitrary origins, globally, including informal-transit cities"
authors = [{name = "Bobby Reiner", email = "bcreiner@uw.edu"}]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "numpy (>=2.0.0,<3.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "scipy (>=1.0.0,<2.0.0)",
    "pyarrow (>=15.0.0,<20.0.0)",
    "click (>=8.0.0,<9.0.0)",
    "matplotlib (>=3.8.0,<4.0.0)",
    "folium (>=0.17.0,<1.0.0)",
    "geopandas (>=1.0.0,<2.0.0)",
    "osmnx (>=2.0.0,<3.0.0)",
    "openrouteservice (>=2.3.0,<3.0.0)",
    "branca (>=0.7.0,<1.0.0)",
    "shapely (>=2.0.0,<3.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "rasterio (>=1.3.0,<2.0.0)",
    "scikit-image (>=0.22.0,<1.0.0)",
    "scikit-learn (>=1.4.0,<2.0.0)",
    "affine (>=2.4.0,<3.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
]

[project.scripts]
run-isochrone = "idd_travel_time.run_isochrone:main"

[tool.poetry]
packages = [{ include = "idd_travel_time", from = "src" }]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.0"
pre-commit = "^4.0"
pytest = "^8.0"
pytest-cov = "*"
ruff = "^0.9"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
src = ["src"]
extend-exclude = ["notebooks/"]  # vignettes are illustrative; production rules don't apply

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # trailing comma — formatter handles
    "ISC001",   # implicit string concat
    "ANN",      # type hints — mypy handles
    "D",        # docstrings — too strict
    "E501",     # line length — autoformatted
    "RET505",   # else after return
    "TC001",    # typing-only first-party import — not worth the TYPE_CHECKING dance
    "TC003",    # typing-only stdlib import — same
    "RUF001",   # ambiguous unicode — we don't intentionally use confusables
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # asserts are how pytest works
    "ARG",      # pytest fixtures sometimes look unused
    "S105",     # hardcoded passwords in tests
    "PLR2004",  # tests inherently use magic values (dpi=72, n=100)
    "SLF001",   # tests legitimately access private members
    "FBT001",   # boolean trap is fine in test parametrisation
    "FBT002",   # default-bool args fine in tests
    "SIM117",   # nested `with` for mocking is clearer than combined
    "N806",     # tests sometimes use non-lowercase for emphasis
    "E741",     # single-char vars in tests
    "PD901",    # `df` is fine in tests
    "RUF003",   # tests don't author user-facing comment content
    "ERA001",   # commented test code can be reference / debug history
]
"src/idd_travel_time/run_isochrone.py" = ["PLR0913"]  # CLI: @click.option decorators count as args
"**/io/__init__.py" = ["A005"]  # `io` is the namespaced package name, not stdlib shadowing in practice

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
# Test fixtures and parametrised functions naturally don't carry full type
# annotations; relax strict checks for test code only.
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "idd_travel_time.run_isochrone"
# click's @command/@option decorators don't preserve function signatures —
# disabling the rule here is cleaner than scattering # type: ignore on every
# decorator.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short --cov=src --cov-report=term-missing"
